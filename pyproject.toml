[project]
name = "agencycrm"
version = "0.11.0"
description = "AgencyCRM — seguimiento controlado y recordatorios internos"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"config/settings/local.py" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E501"]

[tool.coverage.run]
source = ["apps", "common", "integrations"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
