{% extends "base.html" %}
{% block title %}Acceder · AgencyCRM{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3 mb-4">Acceder a AgencyCRM</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}<p class="alert alert-danger" role="alert">Usuario o contraseña incorrectos.</p>{% endif %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Usuario</label>
        <input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Contraseña</label>
        <input class="form-control" type="password" id="id_password" name="password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
